<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" id="theme-color" content="#f3f6f4" />
    <meta
      name="description"
      content="VeloLayer: qué ropa de ciclismo llevarte según la previsión meteorológica a lo largo de toda tu ruta."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VeloLayer" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>VeloLayer</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Aplica el tema guardado (modo noche) antes del primer pintado.
      try {
        var t = localStorage.getItem('velolayer-theme') === 'dark' ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        document.getElementById('theme-color').content = t === 'dark' ? '#0a0d0c' : '#f3f6f4'
      } catch (e) {
        /* sin localStorage disponible: tema claro */
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
